# GitHub Actions Workflow: build และ deploy แอปขึ้น GitHub Pages อัตโนมัติ
# ทำงานทุกครั้งที่มีการ push โค้ดเข้า branch main

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # อนุญาตให้กด "Run workflow" เองได้จากหน้า GitHub ด้วย (เผื่ออยาก deploy ซ้ำโดยไม่ต้อง push ใหม่)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug - Check secrets exist
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "❌ VITE_SUPABASE_URL is EMPTY"
          else
            echo "✅ VITE_SUPABASE_URL has a value (length: ${#VITE_SUPABASE_URL})"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "❌ VITE_SUPABASE_ANON_KEY is EMPTY"
          else
            echo "✅ VITE_SUPABASE_ANON_KEY has a value (length: ${#VITE_SUPABASE_ANON_KEY})"
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4